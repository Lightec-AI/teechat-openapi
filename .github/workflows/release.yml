# Tag release: build binaries, record SHA256SUMS, attach attestation allowlist asset.
#
# Required for GitHub-primary OpenAPI edge attestation trust.
# After publishing, mirror the same openapi-edge-attest.json to teechat.ai
# (Ed25519-signed) as network fallback — see TeeChat docs/ops/openapi-edge-attestation-manifest.md
#
# Cut: git tag vX.Y.Z && git push origin vX.Y.Z
# Before tagging for production: ensure manifest/release/openapi-edge-attest.json
# code_hash matches the built openapi binary and TEE measurements are real.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Path dep → ../../../attested-mtls. actions/checkout forbids path: ../…;
      # checkout inside workspace then symlink to the sibling Cargo expects.
      - uses: actions/checkout@v5
        with:
          repository: Lightec-AI/teechat-attested-mtls
          path: _attested-mtls
      - name: Symlink attested-mtls sibling for Cargo path dep
        run: ln -sfn "$GITHUB_WORKSPACE/_attested-mtls" "$GITHUB_WORKSPACE/../attested-mtls"

      - uses: dtolnay/rust-toolchain@1.88

      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: |
          cargo build --release -p openapi
          cargo build --release -p teechat-openapi-attest

      - name: Stage artifacts + SHA256SUMS
        run: |
          set -euo pipefail
          mkdir -p dist
          cp target/release/openapi dist/openapi
          cp target/release/teechat-openapi-attest dist/teechat-openapi-attest
          (
            cd dist
            sha256sum openapi teechat-openapi-attest | tee SHA256SUMS
          )
          CODE_HASH="$(awk '/ openapi$/ {print $1}' dist/SHA256SUMS)"
          if [[ -f manifest/release/openapi-edge-attest.json ]]; then
            cp manifest/release/openapi-edge-attest.json dist/openapi-edge-attest.json
            python3 - dist/openapi-edge-attest.json <<'PY'
          import json, re, sys
          path = sys.argv[1]
          doc = json.load(open(path, encoding="utf-8"))
          if doc.get("policy", {}).get("require_runtime_policy_pin") is not True:
              raise SystemExit("release manifest must require runtime policy pins")
          for region in doc.get("regions", []):
              for release in region.get("active", []):
                  value = release.get("policy_hash", "")
                  if re.fullmatch(r"[0-9a-f]{64}", value) is None:
                      raise SystemExit(
                          f"active release missing valid policy_hash: "
                          f"{region.get('region')} {release.get('build_version')}"
                      )
          PY
            # Allowlist code_hashes are the *deployed* CVM edge binaries — one per active
            # row during an overlap window (old live edge + newly released edge). GHA
            # ubuntu builds are for the attest CLI + transparency and may differ. Clients
            # cross-check the *live* edge code_hash against SHA256SUMS (github_release.rs
            # cross_check_code_hash_against_sha256sums), so EVERY active row hash must be
            # discoverable here — not just the first row — or the old edge fails GitHub
            # verification during cutover.
            mapfile -t MANIFEST_HASHES < <(python3 -c 'import json;[print(r["code_hash"]) for reg in json.load(open("dist/openapi-edge-attest.json"))["regions"] for r in reg["active"]]')
            for H in "${MANIFEST_HASHES[@]}"; do
              if ! grep -qi "${H}" dist/SHA256SUMS; then
                echo "${H}  openapi (allowlist code_hash / deployed edge)" >> dist/SHA256SUMS
              fi
            done
            if ! printf '%s\n' "${MANIFEST_HASHES[@]}" | grep -qi "${CODE_HASH}"; then
              echo "::warning::CI openapi hash (${CODE_HASH}) not in allowlist active rows. Expected when the deployed edge is a CVM build — allowlist + SHA256SUMS remain the challenge trust root; update the allowlist from the guest binary before cutover."
            fi
          else
            echo "::error::manifest/release/openapi-edge-attest.json is required; CI stubs cannot be release trust roots"
            exit 1
          fi
          echo "Artifacts:"
          ls -la dist
          cat dist/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/openapi
            dist/teechat-openapi-attest
            dist/SHA256SUMS
            dist/openapi-edge-attest.json
          generate_release_notes: true
          body: |
            ## Attestation trust root

            - **`SHA256SUMS`** — digests of `openapi` + `teechat-openapi-attest`
            - **`openapi-edge-attest.json`** — edge allowlist (mirror to www `.well-known` as signed fallback)

            Verify: `teechat-openapi-attest verify https://openapi.teechat.ai`
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
